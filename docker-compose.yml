version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: healthbridge_postgres
    environment:
      POSTGRES_DB: healthbridge_db
      POSTGRES_USER: healthbridge_user
      POSTGRES_PASSWORD: healthbridge_pass_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthbridge_user -d healthbridge_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: healthbridge_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
