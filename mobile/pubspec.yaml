name: healthbridge_bd
description: HealthBridge BD - Bengali Healthcare Intelligence Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Navigation
  go_router: ^13.2.0

  # HTTP Client
  dio: ^5.4.3+1

  # Local Storage
  shared_preferences: ^2.2.3

  # UI Components
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1

  # Icons
  material_design_icons_flutter: ^7.0.7296

  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
